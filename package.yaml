name: langchain-hs
version: 0.0.5.0
github: "tusharad/langchain-hs"
license: MIT
author: "Tushar Adhatrao"
maintainer: "tusharadhatrao@gmail.com"
copyright: "2026 tushar"
category: Web, AI
synopsis: "Haskell implementation of Langchain"
extra-source-files:
  - README.md
  - CHANGELOG.md

description: Build LLM-powered applications in Haskell.

tested-with:
  - GHC == 9.10.1
  - GHC == 9.8.4
  - GHC == 9.6.6
  - GHC == 9.4.8

dependencies:
  - aeson >= 2 && < 3
  - async < 3
  - base >= 4.7 && < 5
  - base64-bytestring >= 1.2 && < 1.3
  - bytestring >= 0.10
  - conduit >= 1.2 && < 1.4
  - containers >= 0.6 && < 0.9
  - directory >= 1.3.6 && < 1.4
  - resourcet >= 1.2 && < 1.4
  - filepath < 2
  - ginger >= 0.10.6 && < 0.11
  - http-client
  - http-client-tls
  - http-conduit >= 2 && < 3
  - http-types >= 0.11 && < 0.13
  - langchain-hs-core
  - langchain-hs-graph
  - mtl >= 2.2 && < 2.4
  - ollama-haskell >= 0.4.0.0
  - openai >= 2.2.1
  - pdf-toolbox-document == 0.1.4
  - process >= 1.6 && < 1.7
  - pystrformat
  - random >= 1.2
  - scientific
  - servant >= 0.20 && < 0.21
  - servant-client >= 0.20 && < 0.21
  - servant-client-core >= 0.20 && < 0.21
  - servant-conduit >= 0.16 && < 0.17
  - servant-event-stream >= 0.4 && < 0.5
  - sqlite-simple >= 0.4.18 && < 0.5
  - stache >= 2.3 && < 2.5
  - stm >= 2.5 && < 2.6
  - tagsoup < 0.15
  - text >= 1.2 && < 3
  - time >= 1.9 && < 1.15
  - transformers
  - vector < 0.14

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src

tests:
  langchain-hs-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - langchain-hs
      - langchain-hs-core
      - langchain-hs-graph
      - text
      - bytestring
      - aeson
      - containers
      - directory
      - filepath
      - temporary
      - tasty
      - tasty-hunit
      - tasty-quickcheck
      - QuickCheck
      - async
      - http-conduit
      - http-types
      - servant
      - servant-event-stream
      - servant-server
      - wai
      - warp

benchmarks:
  langchain-hs-bench:
    main: Main.hs
    source-dirs: bench
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
      - -Wall
    dependencies:
      - langchain-hs
      - langchain-hs-core
      - langchain-hs-graph
      - text
      - aeson
      - tasty-bench
