name: langchain-hs
version: 0.0.6.0
github: "tusharad/langchain-hs"
license: MIT
license-file: LICENSE
author: "Tushar Adhatrao"
maintainer: "tusharadhatrao@gmail.com"
copyright: "2025-2026 Tushar Adhatrao"
category: AI
synopsis: "Pure functional LLM agent framework and multi-agent graph engine in Haskell"
extra-source-files:
  - README.md
  - CHANGELOG.md

description: |
  Build LLM-powered applications, ReAct agents, and LangGraph-style stateful workflows
  in Haskell. Provider-specific packages:
    - langchain-hs-ollama
    - langchain-hs-openai
    - langchain-hs-gemini
    - langchain-hs-mcp

tested-with:
  - GHC == 9.12.4
  - GHC == 9.10.3
  - GHC == 9.8.4

dependencies:
  - aeson >= 2 && < 3
  - async >= 2.2 && < 2.3
  - base >= 4.17 && < 5
  - bytestring >= 0.10 && < 0.13
  - conduit >= 1.2 && < 1.4
  - containers >= 0.6 && < 0.9
  - directory >= 1.3.6 && < 1.4
  - filepath >= 1.4 && < 2
  - format-heavy >= 0.1 && < 0.2
  - langchain-hs-core >= 0.0.6 && < 0.0.7
  - langchain-hs-graph >= 0.0.6 && < 0.0.7
  - mtl >= 2.2 && < 2.4
  - process >= 1.6 && < 1.7
  - random >= 1.2 && < 1.3
  - scientific >= 0.3 && < 0.4
  - sqlite-simple >= 0.4.18 && < 0.5
  - stm >= 2.5 && < 2.6
  - text >= 1.2 && < 3
  - time >= 1.9 && < 1.15
  - transformers >= 0.5 && < 0.7
  - vector >= 0.12 && < 0.14

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src

tests:
  langchain-hs-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - langchain-hs
      - langchain-hs-core
      - langchain-hs-graph
      - text
      - bytestring
      - aeson
      - aeson-qq
      - containers
      - directory
      - filepath
      - temporary
      - tasty
      - tasty-hunit
      - tasty-quickcheck
      - QuickCheck
      - async
      - resourcet
