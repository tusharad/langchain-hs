name: langchain-hs
version: 0.0.5.0
github: "tusharad/langchain-hs"
license: MIT
license-file: LICENSE
author: "Tushar Adhatrao"
maintainer: "tusharadhatrao@gmail.com"
copyright: "2025-2026 Tushar Adhatrao"
category: Web, AI
synopsis: "Pure functional LLM agent framework and multi-agent graph engine in Haskell"
extra-source-files:
  - README.md
  - CHANGELOG.md

description: Build LLM-powered applications, ReAct agents, and LangGraph-style stateful workflows in Haskell with zero unsafePerformIO.

tested-with:
  - GHC == 9.10.1
  - GHC == 9.8.4
  - GHC == 9.6.6
  - GHC == 9.4.8

dependencies:
  - aeson >= 2 && < 3
  - async >= 2.2 && < 2.3
  - base >= 4.17 && < 5
  - base64-bytestring >= 1.2 && < 1.3
  - bytestring >= 0.10 && < 0.13
  - conduit >= 1.2 && < 1.4
  - containers >= 0.6 && < 0.9
  - directory >= 1.3.6 && < 1.4
  - resourcet >= 1.2 && < 1.4
  - filepath >= 1.4 && < 2
  - http-client >= 0.7 && < 0.8
  - http-client-tls >= 0.3 && < 0.5
  - http-conduit >= 2 && < 3
  - http-types >= 0.11 && < 0.13
  - langchain-hs-core >= 0.0.5 && < 0.0.6
  - langchain-hs-graph >= 0.0.5 && < 0.0.6
  - mtl >= 2.2 && < 2.4
  - ollama-haskell >= 0.4.0.0 && < 0.5
  - openai >= 2.2.1 && < 3
  - process >= 1.6 && < 1.7
  - pystrformat >= 0.1 && < 0.2
  - random >= 1.2 && < 1.3
  - scientific >= 0.3 && < 0.4
  - servant >= 0.20 && < 0.21
  - servant-client >= 0.20 && < 0.21
  - servant-client-core >= 0.20 && < 0.21
  - servant-conduit >= 0.16 && < 0.17
  - servant-event-stream >= 0.4 && < 0.5
  - sqlite-simple >= 0.4.18 && < 0.5
  - stm >= 2.5 && < 2.6
  - tagsoup >= 0.14 && < 0.15
  - text >= 1.2 && < 3
  - time >= 1.9 && < 1.15
  - transformers >= 0.5 && < 0.7
  - vector >= 0.12 && < 0.14

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src

tests:
  langchain-hs-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - langchain-hs
      - langchain-hs-core
      - langchain-hs-graph
      - text
      - bytestring
      - aeson
      - containers
      - directory
      - filepath
      - temporary
      - tasty
      - tasty-hunit
      - tasty-quickcheck
      - QuickCheck
      - async
      - http-conduit
      - http-types
      - servant
      - servant-event-stream
      - servant-server
      - wai
      - warp

benchmarks:
  langchain-hs-bench:
    main: Main.hs
    source-dirs: bench
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
      - -Wall
    dependencies:
      - langchain-hs
      - langchain-hs-core
      - langchain-hs-graph
      - text
      - aeson
      - tasty-bench
