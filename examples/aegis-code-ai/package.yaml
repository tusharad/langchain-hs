name:                aegis-code-ai
version:             0.1.0.0
synopsis:            Enterprise Autonomous Software Security & Refactoring Engine
description:         AegisCode AI — an enterprise-grade distributed autonomous AI agent platform
                     built on langchain-hs for continuous static analysis, security vulnerability
                     remediation, dead-code elimination, and architectural refactoring.
category:            AI, Security, Development
author:              Tushar Adhatrao
maintainer:          tusharadhatrao@gmail.com
copyright:           2025-2026 Tushar Adhatrao
license:             MIT
github:              tusharad/langchain-hs

extra-source-files:
- README.md

dependencies:
- base >= 4.17 && < 5
- aeson >= 2.0 && < 3
- async >= 2.2 && < 2.3
- bytestring >= 0.10 && < 0.13
- conduit >= 1.3 && < 1.4
- containers >= 0.6 && < 0.9
- directory >= 1.3.6 && < 1.4
- filepath < 2
- http-conduit >= 2 && < 3
- langchain-hs
- langchain-hs-core
- langchain-hs-graph
- mtl >= 2.2 && < 2.4
- process >= 1.6 && < 1.7
- random >= 1.2 && < 1.3
- servant-server >= 0.20 && < 0.21
- sqlite-simple >= 0.4.18 && < 0.5
- stm >= 2.5 && < 2.6
- text >= 1.2 && < 3
- time >= 1.9 && < 1.15
- transformers >= 0.5 && < 0.7
- uuid >= 1.3 && < 1.4
- vector >= 0.12 && < 0.14
- wai >= 3.2 && < 3.3
- wai-websockets >= 3.0 && < 3.1
- warp >= 3.3 && < 3.5
- websockets >= 0.12 && < 0.14
- optparse-applicative >= 0.17 && < 0.19
- unliftio >= 0.2 && < 0.3
- unordered-containers >= 0.2 && < 0.3

default-extensions:
  - DeriveAnyClass
  - DeriveGeneric
  - FlexibleContexts
  - FlexibleInstances
  - GADTs
  - GeneralizedNewtypeDeriving
  - MultiParamTypeClasses
  - OverloadedStrings
  - RecordWildCards
  - ScopedTypeVariables
  - TypeFamilies

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  exposed-modules:
    # Core Types
    - Aegis.Core.Types.Config
    - Aegis.Core.Types.Security
    - Aegis.Core.Types.AST
    - Aegis.Core.Types.Pipeline
    # Tools
    - Aegis.Tools.Git
    - Aegis.Tools.Docker
    - Aegis.Tools.Linter
    - Aegis.Tools.ASTTransformer
    - Aegis.Tools.CodeSearch
    # RAG
    - Aegis.RAG.ASTChunker
    - Aegis.RAG.CodeLoader
    - Aegis.RAG.HybridRetriever
    - Aegis.RAG.Indexer
    # Middleware
    - Aegis.Middleware.ProviderFailover
    - Aegis.Middleware.TokenBudget
    - Aegis.Middleware.CircuitBreaker
    - Aegis.Middleware.Telemetry
    # Agents
    - Aegis.Agents.TriageAgent
    - Aegis.Agents.RefactorAgent
    - Aegis.Agents.VerificationAgent
    - Aegis.Agents.HITLAgent
    - Aegis.Agents.Supervisor
    # Graph
    - Aegis.Graph.Nodes
    - Aegis.Graph.SubGraphs
    - Aegis.Graph.Pipeline
    - Aegis.Graph.Checkpointer
    # Server
    - Aegis.Server.API
    - Aegis.Server.WebSocket
    - Aegis.Server.Persistence
    - Aegis.Server.Server

executables:
  aegis-code-ai:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - aegis-code-ai
