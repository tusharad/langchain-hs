name:                langchain-hs-gemini
version:             0.0.6.0
synopsis:            Google Gemini provider for langchain-hs
description:
  Google Gemini ChatModel provider for langchain-hs. Supports multi-modal
  content, streaming via Server-Sent Events, and function calling.
  Does not depend on OpenAI or Ollama packages.
category:            AI
author:              Tushar Adhatrao
maintainer:          tusharadhatrao@gmail.com
copyright:           2025-2026 Tushar Adhatrao
license:             MIT
license-file:        LICENSE
github:              "tusharad/langchain-hs"

extra-source-files:
  - README.md
  - CHANGELOG.md

tested-with:
  - GHC == 9.12.4
  - GHC == 9.10.3
  - GHC == 9.8.4

dependencies:
  - aeson >= 2.0 && < 3
  - async >= 2.2 && < 2.3
  - base >= 4.17 && < 5
  - bytestring >= 0.10 && < 0.13
  - conduit >= 1.3 && < 1.4
  - containers >= 0.6 && < 0.9
  - http-client >= 0.7 && < 0.8
  - http-client-tls >= 0.3 && < 0.5
  - http-conduit >= 2 && < 3
  - langchain-hs >= 0.0.6 && < 0.0.7
  - langchain-hs-core >= 0.0.6 && < 0.0.7
  - mtl >= 2.2 && < 2.4
  - servant >= 0.20 && < 0.21
  - servant-client >= 0.20 && < 0.21
  - servant-client-core >= 0.20 && < 0.21
  - servant-conduit >= 0.16 && < 0.17
  - servant-event-stream >= 0.4 && < 0.5
  - stm >= 2.5 && < 2.6
  - text >= 1.2 && < 3
  - transformers >= 0.5 && < 0.7

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src
  exposed-modules:
    - Langchain.Provider.Gemini

tests:
  langchain-hs-gemini-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - langchain-hs-gemini
      - langchain-hs
      - langchain-hs-core
      - text
      - bytestring
      - aeson
      - containers
      - tasty
      - tasty-hunit
      - warp
      - wai
      - resourcet
      - http-types
      - aeson-qq

