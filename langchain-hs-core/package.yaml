name:                langchain-hs-core
version:             0.0.6.0
synopsis:            Core typeclasses and pure AST primitives for langchain-hs
description:         Zero HTTP dependency core package containing ChatModel, RunnableTree, ContentBlock, Tool, and StreamEvent primitives.
category:            Web, AI, Control
author:              Tushar Adhatrao
maintainer:          tusharadhatrao@gmail.com
copyright:           2025-2026 Tushar Adhatrao
license:             MIT
license-file:        LICENSE
github:              "tusharad/langchain-hs"

extra-source-files:
  - README.md
  - CHANGELOG.md

tested-with:
  - GHC == 9.12.4
  - GHC == 9.10.3
  - GHC == 9.8.4

dependencies:
- aeson >= 2.0 && < 3
- async >= 2.2 && < 2.3
- base >= 4.17 && < 5
- base64-bytestring >= 1.2 && < 1.3
- bytestring >= 0.10 && < 0.13
- conduit >= 1.3 && < 1.4
- containers >= 0.6 && < 0.9
- deepseq >= 1.4 && < 1.6
- mtl >= 2.2 && < 2.4
- resourcet >= 1.2 && < 1.4
- stm >= 2.5 && < 2.6
- text >= 1.2 && < 3
- time >= 1.9 && < 1.15
- directory >= 1.3 && < 1.4
- filepath >= 1.4 && < 2
- process >= 1.6 && < 1.7
- scientific >= 0.3 && < 0.4
- format-heavy >= 0.1 && < 0.2

default-extensions:
  - MultiParamTypeClasses
  - FunctionalDependencies
  - TypeFamilies
  - TypeOperators
  - DataKinds
  - GADTs
  - OverloadedStrings
  - DeriveGeneric
  - DeriveAnyClass
  - RecordWildCards
  - FlexibleContexts

library:
  source-dirs: src
  exposed-modules:
    - Langchain.Error
    - Langchain.Model
    - Langchain.Model.Types
    - Langchain.Monad
    - Langchain.Stream
    - Langchain.Runnable
    - Langchain.Tool
    - Langchain.Tool.Binding
    - Langchain.Tool.Calculator
    - Langchain.Tool.Core
    - Langchain.Tool.FileSystem
    - Langchain.Tool.GenericSchema
    - Langchain.Tool.Shell
    - Langchain.Embeddings
    - Langchain.Embeddings.Core
    - Langchain.DocumentLoader
    - Langchain.DocumentLoader.Core
    - Langchain.DocumentLoader.DirectoryLoader
    - Langchain.DocumentLoader.FileLoader
    - Langchain.TextSplitter.Character
    - Langchain.TextSplitter.Code
    - Langchain.TextSplitter.Markdown
    - Langchain.TextSplitter.RecursiveCharacter
    - Langchain.TextSplitter.Token
    - Langchain.VectorStore
    - Langchain.VectorStore.Core
    - Langchain.VectorStore.InMemory
    - Langchain.PromptTemplate
    - Langchain.PromptTemplate.Prompt
    - Langchain.PromptTemplate.String

tests:
  langchain-hs-core-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - async >= 2.2 && < 2.3
    - langchain-hs-core
    - resourcet
    - stm >= 2.5 && < 2.6
    - QuickCheck >= 2.14
    - tasty >= 1.4
    - tasty-hunit >= 0.10
    - tasty-quickcheck >= 0.10
