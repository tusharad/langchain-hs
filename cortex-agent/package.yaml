name: cortex-agent
version: 0.1.0.0
synopsis: Cognitive Multi-Agent Deep Research & Enterprise Second-Brain Engine
description: Production-grade multi-agent autonomous deep research, enterprise second-brain RAG, and dynamic flow execution engine in pure Haskell.
category: AI, Machine Learning, Agents
author: Tushar Adhatrao
maintainer: tusharadhatrao@gmail.com
license: MIT
github: tusharadhatrao/cortex-agent

extra-source-files:
- README.md

dependencies:
- base >= 4.7 && < 5
- aeson >= 2.0
- async >= 2.2
- bytestring >= 0.10 && < 0.13
- conduit >= 1.2 && < 1.4
- containers >= 0.6 && < 0.9
- directory >= 1.3.6 && < 1.4
- filepath < 2
- http-client
- http-conduit >= 2 && < 3
- http-types >= 0.11 && < 0.13
- langchain-hs
- langchain-hs-core
- langchain-hs-graph
- mtl >= 2.2 && < 2.4
- ollama-haskell >= 0.3.0.0
- QuickCheck >= 2.14
- random >= 1.2
- scientific
- sqlite-simple >= 0.4.18 && < 0.5
- stm >= 2.5 && < 2.6
- tagsoup < 0.15
- text >= 1.2 && < 3
- time >= 1.9 && < 1.15
- transformers
- vector < 0.14

library:
  source-dirs: src
  ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

executables:
  cortex-cli:
    main: Main.hs
    source-dirs: app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - cortex-agent

tests:
  cortex-agent-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - cortex-agent
    - tasty >= 1.4 && < 1.6
    - tasty-hunit >= 0.10 && < 0.11
    - tasty-quickcheck >= 0.10 && < 0.12
