name:                langchain-hs-anthropic
version:             0.0.6.2
synopsis:            Anthropic Claude Messages API provider for langchain-hs
description:
  Native Anthropic Claude Messages API (/v1/messages) ChatModel, ToolBinder,
  and CacheableChatModel implementation for langchain-hs. Supports multi-modal
  content, tool_use/tool_result calling, extended thinking budgets, prompt caching,
  and SSE streaming with incremental tool_use delta accumulation.
category:            AI
author:              Tushar Adhatrao
maintainer:          tusharadhatrao@gmail.com
copyright:           2025-2026 Tushar Adhatrao
license:             MIT
license-file:        LICENSE
github:              "tusharad/langchain-hs"

extra-source-files:
  - README.md
  - CHANGELOG.md

tested-with:
  - GHC == 9.12.4
  - GHC == 9.10.3
  - GHC == 9.8.4

dependencies:
  - aeson >= 2.0 && < 3
  - base >= 4.17 && < 5
  - bytestring >= 0.10 && < 0.13
  - conduit >= 1.3 && < 1.4
  - containers >= 0.6 && < 0.9
  - http-client >= 0.7 && < 0.8
  - http-client-tls >= 0.3 && < 0.5
  - http-types >= 0.11 && < 0.13
  - langchain-hs-core >= 0.0.6.2 && < 0.0.7
  - mtl >= 2.2 && < 2.4
  - resourcet >= 1.2 && < 1.4
  - text >= 1.2 && < 3

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src
  exposed-modules:
    - Langchain.Provider.Anthropic

tests:
  langchain-hs-anthropic-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - langchain-hs-anthropic
      - langchain-hs-core
      - QuickCheck >= 2.14
      - aeson
      - async
      - bytestring
      - conduit
      - containers
      - http-types
      - mtl
      - resourcet
      - stm
      - tasty
      - tasty-hunit
      - tasty-quickcheck
      - text
      - wai
      - warp

