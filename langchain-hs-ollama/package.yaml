name:                langchain-hs-ollama
version:             0.0.6.0
synopsis:            Ollama provider and embeddings for langchain-hs
description:
  Ollama ChatModel provider and text embeddings integration for langchain-hs.
  Depends only on ollama-haskell; does not pull in OpenAI or Gemini dependencies.
category:            AI
author:              Tushar Adhatrao
maintainer:          tusharadhatrao@gmail.com
copyright:           2025-2026 Tushar Adhatrao
license:             MIT
license-file:        LICENSE
github:              "tusharad/langchain-hs"

extra-source-files:
  - README.md
  - CHANGELOG.md

tested-with:
  - GHC == 9.12.4
  - GHC == 9.10.3
  - GHC == 9.8.4

dependencies:
  - aeson >= 2.0 && < 3
  - base >= 4.17 && < 5
  - bytestring >= 0.10 && < 0.13
  - conduit >= 1.3 && < 1.4
  - containers >= 0.6 && < 0.9
  - langchain-hs >= 0.0.6 && < 0.0.7
  - langchain-hs-core >= 0.0.6 && < 0.0.7
  - mtl >= 2.2 && < 2.4
  - ollama-haskell >= 0.4.0.0 && < 0.5
  - stm >= 2.5 && < 2.6
  - text >= 1.2 && < 3
  - transformers >= 0.5 && < 0.7

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src
  exposed-modules:
    - Langchain.Provider.Ollama
    - Langchain.Embeddings.Ollama

tests:
  langchain-hs-ollama-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - langchain-hs-ollama
      - langchain-hs
      - langchain-hs-core
      - ollama-haskell
      - text
      - bytestring
      - aeson
      - containers
      - tasty
      - tasty-hunit

