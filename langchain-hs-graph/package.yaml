name:                langchain-hs-graph
version:             0.5.0.0
synopsis:            Graph-based stateful agent orchestration engine for langchain-hs
description:         StateGraph, StateReducer, Checkpointer, HITL interrupt/resume, and Multi-Agent supervisor patterns.
category:            Web, AI, Control
author:              Tushar Adhatrao
maintainer:          tusharadhatrao@gmail.com
copyright:           2025-2026 Tushar Adhatrao
license:             MIT

dependencies:
- aeson >= 2.0 && < 3
- async >= 2.2 && < 2.3
- base >= 4.17 && < 5
- bytestring >= 0.10 && < 0.13
- containers >= 0.6 && < 0.9
- langchain-hs-core
- mtl >= 2.2 && < 2.4
- sqlite-simple >= 0.4.18 && < 0.5
- stm >= 2.5 && < 2.6
- text >= 1.2 && < 3
- time >= 1.9 && < 1.15

default-extensions:
  - MultiParamTypeClasses
  - FunctionalDependencies
  - TypeFamilies
  - TypeOperators
  - DataKinds
  - GADTs
  - OverloadedStrings
  - DeriveGeneric
  - DeriveAnyClass
  - RecordWildCards
  - FlexibleContexts
  - ScopedTypeVariables

library:
  source-dirs: src
  exposed-modules:
    - Langchain.Graph.StateGraph
    - Langchain.Graph.Checkpointer
    - Langchain.Graph.HITL
    - Langchain.Graph.MultiAgent
    - Langchain.Graph.Visualization
    - Langchain.Graph.TimeTravel
    - Langchain.Graph.Parallel
    - Langchain.Graph.SubGraph

tests:
  langchain-hs-graph-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - langchain-hs-graph
    - filepath
    - temporary
    - QuickCheck >= 2.14
    - tasty >= 1.4
    - tasty-hunit >= 0.10
    - tasty-quickcheck >= 0.10
