name:                langchain-hs-mcp
version:             0.0.6.0
synopsis:            Model Context Protocol (MCP) client for langchain-hs
description:
  First-class MCP JSON-RPC 2.0 client supporting stdio and HTTP transports.
  Enables Haskell agents to discover and call tools published by any MCP server
  (e.g. Hackage docs, SQLite, filesystem, GitHub). Depends only on
  langchain-hs-core; no provider-specific dependencies.
category:            AI
author:              Tushar Adhatrao
maintainer:          tusharadhatrao@gmail.com
copyright:           2025-2026 Tushar Adhatrao
license:             MIT
license-file:        LICENSE
github:              "tusharad/langchain-hs"

extra-source-files:
  - README.md
  - CHANGELOG.md

tested-with:
  - GHC == 9.12.4
  - GHC == 9.10.3
  - GHC == 9.8.4

dependencies:
  - aeson >= 2.0 && < 3
  - base >= 4.17 && < 5
  - bytestring >= 0.10 && < 0.13
  - http-conduit >= 2 && < 3
  - langchain-hs >= 0.0.6 && < 0.0.7
  - langchain-hs-core >= 0.0.6 && < 0.0.7
  - mtl >= 2.2 && < 2.4
  - process >= 1.6 && < 1.7
  - text >= 1.2 && < 3

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src
  exposed-modules:
    - Langchain.MCP.Client

tests:
  langchain-hs-mcp-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - langchain-hs-mcp
      - langchain-hs
      - langchain-hs-core
      - text
      - bytestring
      - aeson
      - tasty
      - tasty-hunit

