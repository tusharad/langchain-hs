resolver: nightly-2026-10-11

# Monorepo packages — all built together for integration testing.
# Each sub-package also has its own stack.yaml for standalone builds.
packages:
  - ./langchain-hs         # Re-export of langchain-hs-core for backwards compatibility
  - ./langchain-hs-core    # pure typeclasses and AST primitives
  - ./langchain-hs-graph   # StateGraph, HITL, checkpointers
  - ./langchain-hs-mcp     # MCP JSON-RPC 2.0 client
  - ./langchain-hs-ollama  # Ollama provider + embeddings
  - ./langchain-hs-openai  # OpenAI provider + embeddings
  - ./langchain-hs-gemini  # Google Gemini provider

extra-deps:
 - openai-2.5.4@sha256:90722cfa6763749cfa87c5617554e0078db7930ac15bb9620d1314198f0b82f4,6987
 - ollama-haskell-0.4.2.0@sha256:b99db8b70752cad0f9a96dc3823d61b2a67e297ff4368b53986f7c343737b55b,7854
 - mcp-server-0.3.0.0@sha256:85d633f42bbd3110f3f55d8b02bc567a2b5fa8c11a506875a206f8ca60c0b4a3,6880
