resolver: nightly-2026-09-12

# Monorepo packages — all built together for integration testing.
# Each sub-package also has its own stack.yaml for standalone builds.
packages:
  - .                      # langchain-hs (core framework, no providers)
  - ./langchain-hs-core    # pure typeclasses and AST primitives
  - ./langchain-hs-graph   # StateGraph, HITL, checkpointers
  - ./langchain-hs-mcp     # MCP JSON-RPC 2.0 client
  - ./langchain-hs-ollama  # Ollama provider + embeddings
  - ./langchain-hs-openai  # OpenAI provider + embeddings
  - ./langchain-hs-gemini  # Google Gemini provider

extra-deps:
  # ollama-haskell: not on Hackage, pinned to commit with JSON schema support
  - git: https://github.com/tusharad/ollama-haskell
    commit: 408d6790dcd46e55293a983df47ca1988d2051ce

  # MercuryTechnologies openai Haskell client
  - git: https://github.com/MercuryTechnologies/openai
    commit: 2031a05135b892a82b461558d19b813ab67cfb8f

  # Required by openai package
  - servant-multipart-client-0.12.2@sha256:e8105783e7dbef178a38dcfd05f4d12a8229eac88cfe49319f272dcb544e7365,2276

  # Pinned random — resolver ships an older revision that conflicts
  - random-1.2.1.3@sha256:117541ba0a177397a3333f94870f789ef050dca31b0688a19824b2bc401b8823,6237

  # format-heavy: not on Hackage, used by langchain-hs for prompt formatting
  - git: https://github.com/lbobylev/format-heavy
    commit: 81196f86a16de8378a0ad264bf12af42c5ca7b65

  # mcp-server: test dependency for langchain-hs-mcp integration tests
  - mcp-server-0.2.0.1@sha256:7b09ac83c868f7a5b453aefd68c769e9cac5c5b60a0bac3cc418df1ba9587945,6795

  # http-types pinned: resolver ships 0.12.4 which misses a required instance
  - http-types-0.12.5@sha256:cb708ff8d2001dc7bcff615350a835a6dc1b2488829acfcc6d8bc7e13d423153,2927

  # servant-event-stream: SSE support for Gemini streaming
  - servant-event-stream-0.4.0.1@sha256:c79ef3516626850347f2a92c15de473244539f2211c05d0350f4073d1659c669,1760
