name: Haskell CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Fourmolu Formatter Check
        uses: haskell-actions/run-fourmolu@v11
        with:
          version: "latest"
          working-directory: "."

      - name: Set up HLint
        uses: haskell-actions/hlint-setup@v2
        with:
          version: '3.10'

      - name: Run HLint Code Audit
        uses: haskell-actions/hlint-run@v2
        with:
          path: |
            src/
            langchain-hs-core/src/
            langchain-hs-graph/src/
          fail-on: warning

  build-and-test:
    name: Build & Test Monorepo
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Haskell Stack
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.12.2'
          enable-stack: true
          stack-version: 'latest'

      - name: Cache Stack Root & Work Directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
            langchain-hs-core/.stack-work
            langchain-hs-graph/.stack-work
          key: ${{ runner.os }}-stack-${{ hashFiles('**/package.yaml', 'stack.yaml') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: Build Core & Graph Packages
        run: |
          stack build langchain-hs-core langchain-hs-graph --test --no-run-tests

      - name: Run Unit & Property Tests (Core & Graph)
        run: |
          stack test langchain-hs-core langchain-hs-graph

      - name: Install & Warm up Ollama for Integration Testing
        uses: pydantic/ollama-action@v3
        with:
          model: gemma3:latest

      - name: Run Full Workspace Test Suite
        run: |
          stack test

      - name: Build & Run Big Showcase Application
        run: |
          stack run big-showcase

  haddock-docs:
    name: Haddock API Documentation Check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Haskell Stack
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.12.2'
          enable-stack: true
          stack-version: 'latest'

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: ~/.stack
          key: ${{ runner.os }}-haddock-${{ hashFiles('**/package.yaml', 'stack.yaml') }}

      - name: Build Haddock Docs
        run: |
          stack haddock --no-haddock-deps langchain-hs-core langchain-hs-graph langchain-hs
