name: Haskell CI

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/run-fourmolu@v11
        with:
          version: "0.17.0.0"
          working-directory: "./src"

  hlint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: 'Set up HLint'
      uses: haskell-actions/hlint-setup@v2
      with:
        version: '3.10'

    - name: 'Run HLint'
      uses: haskell-actions/hlint-run@v2
      with:
        path: src/
        fail-on: warning

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: generate
        uses: freckle/stack-action/generate-matrix@v5
    outputs:
      stack-yamls: ${{ steps.generate.outputs.stack-yamls }}

  build:
    needs: [generate, hlint, format]
    strategy:
      matrix:
        stack-yaml: ${{ fromJSON(needs.generate.outputs.stack-yamls) }}
      fail-fast: false

    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
    - name: Copy repo into actions 
      uses: actions/checkout@v4

    - name: Install dependencies and build (multi-GHC matrix)
      uses: freckle/stack-action@v5
      with:
          stack-arguments: --stack-yaml ${{ matrix.stack-yaml }}
          test: false
  
  tests:
    needs: build

    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
    - name: Copy repo into actions
      uses: actions/checkout@v4

    - name: Install dependencies, build, and run test suite
      uses: freckle/stack-action@v5
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}

  build-example:
    needs: tests

    runs-on: ubuntu-latest
    steps:
      - name: copy repo
        uses: actions/checkout@v4

      - name: build with stack project
        uses: freckle/stack-action@v5
        with:
          stack-arguments: --work-dir examples/.stack-work

