name: CI

on:
  push:
    branches: [ main, develop, feat/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: GHC ${{ matrix.ghc }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ghc: ['9.6.6', '9.8.4', '9.10.1']

    steps:
    - uses: actions/checkout@v4

    - name: Setup Haskell Stack
      uses: haskell-actions/setup@v2
      with:
        enable-stack: true
        stack-no-global: true

    - name: Cache Stack Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.stack
          .stack-work
        key: ${{ runner.os }}-stack-${{ matrix.ghc }}-${{ hashFiles('stack.yaml', 'package.yaml', '**/*.cabal') }}
        restore-keys: |
          ${{ runner.os }}-stack-${{ matrix.ghc }}-

    - name: Build All Packages
      run: stack build --fast

    - name: Run Unit and Property Test Suites
      run: stack test langchain-hs-core:test:langchain-hs-core-test langchain-hs-graph:test:langchain-hs-graph-test langchain-hs:test:langchain-hs-test --test-arguments="-p '!Live'"

    - name: Run Benchmarks
      run: stack bench --benchmark-arguments="--quick"
