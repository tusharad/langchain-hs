name: Release to Hackage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_to_hackage:
        description: 'Publish source packages (.tar.gz) to Hackage'
        required: true
        type: boolean
        default: true
      publish_docs:
        description: 'Build and publish Haddock documentation (-docs.tar.gz) to Hackage'
        required: true
        type: boolean
        default: true
      as_candidate:
        description: 'Publish as package candidates on Hackage'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  validate-and-package:
    name: Validate and Build Sdists
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up GHC and Cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.8.4'
          cabal-version: 'latest'

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-cabal-release-${{ hashFiles('**/*.cabal', 'cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-cabal-release-

      - name: Run cabal check on all packages
        run: |
          echo "Checking langchain-hs-core..."
          (cd langchain-hs-core && cabal check)
          echo "Checking langchain-hs-graph..."
          (cd langchain-hs-graph && cabal check)
          echo "Checking langchain-hs..."
          cabal check

      - name: Generate sdist tarballs
        run: |
          mkdir -p artifacts
          (cd langchain-hs-core && cabal sdist -o ../artifacts)
          (cd langchain-hs-graph && cabal sdist -o ../artifacts)
          cabal sdist -o artifacts
          echo "Generated packages in artifacts/:"
          ls -la artifacts/

      - name: Generate Haddock documentation tarballs
        if: github.event_name == 'push' || inputs.publish_docs == true
        run: |
          mkdir -p artifacts/docs
          DOCS_DIR=$(mktemp -d dist-docs.XXXXXX)
          echo "Building Haddock for langchain-hs-core..."
          cabal v2-haddock langchain-hs-core --builddir="$DOCS_DIR" --haddock-for-hackage --enable-doc
          echo "Building Haddock for langchain-hs-graph..."
          cabal v2-haddock langchain-hs-graph --builddir="$DOCS_DIR" --haddock-for-hackage --enable-doc
          echo "Building Haddock for langchain-hs..."
          cabal v2-haddock langchain-hs --builddir="$DOCS_DIR" --haddock-for-hackage --enable-doc

          find "$DOCS_DIR" -name "*-docs.tar.gz" -exec cp {} artifacts/docs/ \;
          rm -rf "$DOCS_DIR"
          echo "Generated documentation tarballs in artifacts/docs/:"
          ls -la artifacts/docs/

      - name: Upload sdist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hackage-sdists
          path: artifacts/*.tar.gz

      - name: Upload documentation artifacts
        if: github.event_name == 'push' || inputs.publish_docs == true
        uses: actions/upload-artifact@v4
        with:
          name: hackage-docs
          path: artifacts/docs/*-docs.tar.gz

  publish-hackage:
    name: Publish Packages to Hackage
    needs: validate-and-package
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.publish_to_hackage == true || inputs.publish_docs == true
    steps:
      - name: Set up Cabal
        uses: haskell-actions/setup@v2
        with:
          cabal-version: 'latest'

      - name: Download sdist artifacts
        if: github.event_name == 'push' || inputs.publish_to_hackage == true
        uses: actions/download-artifact@v4
        with:
          name: hackage-sdists
          path: artifacts

      - name: Download documentation artifacts
        if: github.event_name == 'push' || inputs.publish_docs == true
        uses: actions/download-artifact@v4
        with:
          name: hackage-docs
          path: artifacts/docs

      - name: Publish langchain-hs-core to Hackage
        if: github.event_name == 'push' || inputs.publish_to_hackage == true
        env:
          HACKAGE_KEY: ${{ secrets.HACKAGE_KEY }}
          HACKAGE_TOKEN: ${{ secrets.HACKAGE_TOKEN }}
          HACKAGE_USERNAME: ${{ secrets.HACKAGE_USERNAME }}
          HACKAGE_PASSWORD: ${{ secrets.HACKAGE_PASSWORD }}
          CANDIDATE: ${{ inputs.as_candidate == true && '--candidate' || '' }}
        run: |
          AUTH_FLAG=""
          if [ -n "$HACKAGE_TOKEN" ]; then
            AUTH_FLAG="--token $HACKAGE_TOKEN"
          elif [ -n "$HACKAGE_KEY" ]; then
            AUTH_FLAG="--token $HACKAGE_KEY"
          elif [ -n "$HACKAGE_USERNAME" ] && [ -n "$HACKAGE_PASSWORD" ]; then
            AUTH_FLAG="-u $HACKAGE_USERNAME -p $HACKAGE_PASSWORD"
          else
            echo "::error::No Hackage credentials found! Please configure HACKAGE_TOKEN (or HACKAGE_KEY / HACKAGE_USERNAME & HACKAGE_PASSWORD) in GitHub Secrets."
            exit 1
          fi

          PUBLISH_FLAG="--publish"
          if [ "${{ inputs.as_candidate }}" = "true" ]; then
            PUBLISH_FLAG=""
          fi

          CORE_TAR=$(ls artifacts/langchain-hs-core-*.tar.gz)
          echo "Uploading $CORE_TAR to Hackage..."
          cabal upload $AUTH_FLAG $PUBLISH_FLAG $CANDIDATE "$CORE_TAR"

          echo "Waiting 30 seconds for Hackage index update before uploading dependent packages..."
          sleep 30

      - name: Publish langchain-hs-core documentation to Hackage
        if: github.event_name == 'push' || inputs.publish_docs == true
        env:
          HACKAGE_KEY: ${{ secrets.HACKAGE_KEY }}
          HACKAGE_TOKEN: ${{ secrets.HACKAGE_TOKEN }}
          HACKAGE_USERNAME: ${{ secrets.HACKAGE_USERNAME }}
          HACKAGE_PASSWORD: ${{ secrets.HACKAGE_PASSWORD }}
          CANDIDATE: ${{ inputs.as_candidate == true && '--candidate' || '' }}
        run: |
          AUTH_FLAG=""
          if [ -n "$HACKAGE_TOKEN" ]; then
            AUTH_FLAG="--token $HACKAGE_TOKEN"
          elif [ -n "$HACKAGE_KEY" ]; then
            AUTH_FLAG="--token $HACKAGE_KEY"
          elif [ -n "$HACKAGE_USERNAME" ] && [ -n "$HACKAGE_PASSWORD" ]; then
            AUTH_FLAG="-u $HACKAGE_USERNAME -p $HACKAGE_PASSWORD"
          else
            echo "::error::No Hackage credentials found!"
            exit 1
          fi

          PUBLISH_FLAG="--publish"
          if [ "${{ inputs.as_candidate }}" = "true" ]; then
            PUBLISH_FLAG=""
          fi

          CORE_DOC_TAR=$(ls artifacts/docs/langchain-hs-core-*-docs.tar.gz)
          echo "Uploading documentation $CORE_DOC_TAR to Hackage..."
          cabal upload $AUTH_FLAG $PUBLISH_FLAG -d $CANDIDATE "$CORE_DOC_TAR"

      - name: Publish langchain-hs-graph to Hackage
        if: github.event_name == 'push' || inputs.publish_to_hackage == true
        env:
          HACKAGE_KEY: ${{ secrets.HACKAGE_KEY }}
          HACKAGE_TOKEN: ${{ secrets.HACKAGE_TOKEN }}
          HACKAGE_USERNAME: ${{ secrets.HACKAGE_USERNAME }}
          HACKAGE_PASSWORD: ${{ secrets.HACKAGE_PASSWORD }}
          CANDIDATE: ${{ inputs.as_candidate == true && '--candidate' || '' }}
        run: |
          AUTH_FLAG=""
          if [ -n "$HACKAGE_TOKEN" ]; then
            AUTH_FLAG="--token $HACKAGE_TOKEN"
          elif [ -n "$HACKAGE_KEY" ]; then
            AUTH_FLAG="--token $HACKAGE_KEY"
          elif [ -n "$HACKAGE_USERNAME" ] && [ -n "$HACKAGE_PASSWORD" ]; then
            AUTH_FLAG="-u $HACKAGE_USERNAME -p $HACKAGE_PASSWORD"
          fi

          PUBLISH_FLAG="--publish"
          if [ "${{ inputs.as_candidate }}" = "true" ]; then
            PUBLISH_FLAG=""
          fi

          GRAPH_TAR=$(ls artifacts/langchain-hs-graph-*.tar.gz)
          echo "Uploading $GRAPH_TAR to Hackage..."
          cabal upload $AUTH_FLAG $PUBLISH_FLAG $CANDIDATE "$GRAPH_TAR"

          echo "Waiting 30 seconds for Hackage index update before uploading langchain-hs..."
          sleep 30

      - name: Publish langchain-hs-graph documentation to Hackage
        if: github.event_name == 'push' || inputs.publish_docs == true
        env:
          HACKAGE_KEY: ${{ secrets.HACKAGE_KEY }}
          HACKAGE_TOKEN: ${{ secrets.HACKAGE_TOKEN }}
          HACKAGE_USERNAME: ${{ secrets.HACKAGE_USERNAME }}
          HACKAGE_PASSWORD: ${{ secrets.HACKAGE_PASSWORD }}
          CANDIDATE: ${{ inputs.as_candidate == true && '--candidate' || '' }}
        run: |
          AUTH_FLAG=""
          if [ -n "$HACKAGE_TOKEN" ]; then
            AUTH_FLAG="--token $HACKAGE_TOKEN"
          elif [ -n "$HACKAGE_KEY" ]; then
            AUTH_FLAG="--token $HACKAGE_KEY"
          elif [ -n "$HACKAGE_USERNAME" ] && [ -n "$HACKAGE_PASSWORD" ]; then
            AUTH_FLAG="-u $HACKAGE_USERNAME -p $HACKAGE_PASSWORD"
          fi

          PUBLISH_FLAG="--publish"
          if [ "${{ inputs.as_candidate }}" = "true" ]; then
            PUBLISH_FLAG=""
          fi

          GRAPH_DOC_TAR=$(ls artifacts/docs/langchain-hs-graph-*-docs.tar.gz)
          echo "Uploading documentation $GRAPH_DOC_TAR to Hackage..."
          cabal upload $AUTH_FLAG $PUBLISH_FLAG -d $CANDIDATE "$GRAPH_DOC_TAR"

      - name: Publish langchain-hs to Hackage
        if: github.event_name == 'push' || inputs.publish_to_hackage == true
        env:
          HACKAGE_KEY: ${{ secrets.HACKAGE_KEY }}
          HACKAGE_TOKEN: ${{ secrets.HACKAGE_TOKEN }}
          HACKAGE_USERNAME: ${{ secrets.HACKAGE_USERNAME }}
          HACKAGE_PASSWORD: ${{ secrets.HACKAGE_PASSWORD }}
          CANDIDATE: ${{ inputs.as_candidate == true && '--candidate' || '' }}
        run: |
          AUTH_FLAG=""
          if [ -n "$HACKAGE_TOKEN" ]; then
            AUTH_FLAG="--token $HACKAGE_TOKEN"
          elif [ -n "$HACKAGE_KEY" ]; then
            AUTH_FLAG="--token $HACKAGE_KEY"
          elif [ -n "$HACKAGE_USERNAME" ] && [ -n "$HACKAGE_PASSWORD" ]; then
            AUTH_FLAG="-u $HACKAGE_USERNAME -p $HACKAGE_PASSWORD"
          fi

          PUBLISH_FLAG="--publish"
          if [ "${{ inputs.as_candidate }}" = "true" ]; then
            PUBLISH_FLAG=""
          fi

          MAIN_TAR=$(ls artifacts/langchain-hs-[0-9]*.tar.gz)
          echo "Uploading $MAIN_TAR to Hackage..."
          cabal upload $AUTH_FLAG $PUBLISH_FLAG $CANDIDATE "$MAIN_TAR"

      - name: Publish langchain-hs documentation to Hackage
        if: github.event_name == 'push' || inputs.publish_docs == true
        env:
          HACKAGE_KEY: ${{ secrets.HACKAGE_KEY }}
          HACKAGE_TOKEN: ${{ secrets.HACKAGE_TOKEN }}
          HACKAGE_USERNAME: ${{ secrets.HACKAGE_USERNAME }}
          HACKAGE_PASSWORD: ${{ secrets.HACKAGE_PASSWORD }}
          CANDIDATE: ${{ inputs.as_candidate == true && '--candidate' || '' }}
        run: |
          AUTH_FLAG=""
          if [ -n "$HACKAGE_TOKEN" ]; then
            AUTH_FLAG="--token $HACKAGE_TOKEN"
          elif [ -n "$HACKAGE_KEY" ]; then
            AUTH_FLAG="--token $HACKAGE_KEY"
          elif [ -n "$HACKAGE_USERNAME" ] && [ -n "$HACKAGE_PASSWORD" ]; then
            AUTH_FLAG="-u $HACKAGE_USERNAME -p $HACKAGE_PASSWORD"
          fi

          PUBLISH_FLAG="--publish"
          if [ "${{ inputs.as_candidate }}" = "true" ]; then
            PUBLISH_FLAG=""
          fi

          MAIN_DOC_TAR=$(ls artifacts/docs/langchain-hs-[0-9]*-docs.tar.gz)
          echo "Uploading documentation $MAIN_DOC_TAR to Hackage..."
          cabal upload $AUTH_FLAG $PUBLISH_FLAG -d $CANDIDATE "$MAIN_DOC_TAR"

  create-github-release:
    name: Create GitHub Release
    needs: validate-and-package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download sdist artifacts
        uses: actions/download-artifact@v4
        with:
          name: hackage-sdists
          path: artifacts

      - name: Download documentation artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hackage-docs
          path: artifacts/docs

      - name: Extract Release Notes from CHANGELOG
        id: notes
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver { flag=1; next }
            $0 ~ "^## " && flag { flag=0; exit }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release $TAG_NAME" > RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/*.tar.gz
            artifacts/docs/*-docs.tar.gz
          draft: false
          prerelease: false
